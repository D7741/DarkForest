<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbox Redesign — Isolated Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --void-black: #05070D;
    --deep-navy: #0B1530;
    --star-white: #EDEFF3;
    --silver: #B8C2CC;
    --font-head: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void-black);
    color: var(--star-white);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 4rem 1.5rem;
  }

  .intro {
    max-width: 34rem;
    margin: 0 auto 3.5rem;
    text-align: center;
  }

  .intro span {
    display: block;
    font-family: var(--font-body);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--silver);
    opacity: 0.6;
    margin-bottom: 0.75rem;
  }

  .intro p {
    color: var(--silver);
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .compare {
    max-width: 34rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 3.5rem;
  }

  .compare-label {
    font-family: var(--font-body);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--silver);
    margin-bottom: 1rem;
  }

  .compare-label.proposed {
    color: var(--star-white);
  }

  /* ---------- Shared chat internals (identical to the real site) ---------- */

  .chat-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid rgba(184, 194, 204, 0.2);
  }

  .waveform {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1px;
    flex-shrink: 0;
  }

  .wf-bar {
    width: 1.6px;
    height: 30px;
    background: var(--silver);
    transform: scaleY(0.06);
    transform-origin: center;
    will-change: transform;
  }

  .chat-label {
    font-family: var(--font-body);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--silver);
  }

  .chat-message {
    font-family: var(--font-mono);
    font-size: clamp(0.85rem, 2vw, 0.95rem);
    line-height: 1.7;
    color: var(--star-white);
  }

  .cursor {
    display: inline-block;
    color: var(--silver);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .support-btn {
    margin-top: 1.5rem;
    width: 100%;
    background: transparent;
    border: 1px solid var(--silver);
    border-radius: 2px;
    color: var(--star-white);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    padding: 0.9rem 1rem;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .support-btn:hover {
    background: var(--silver);
    color: var(--void-black);
  }

  /* ---------- Variant A: current (flat bordered box) ---------- */

  .chatbox-current {
    width: 100%;
    background: var(--deep-navy);
    border: 1px solid var(--silver);
    border-radius: 4px;
    padding: 1.75rem clamp(1.25rem, 4vw, 2rem);
  }

  /* ---------- Variant B: proposed — "uplink terminal" HUD card ---------- */

  .uplink-card {
    position: relative;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .uplink-card.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Rotating conic gradient, oversized + centered. Only the 1px sliver not
     covered by .uplink-mask is visible, reading as a bright arc travelling
     around the border. */
  .uplink-ring {
    position: absolute;
    inset: -60%;
    z-index: 0;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 250deg,
      rgba(184, 194, 204, 0.5) 285deg,
      var(--star-white) 305deg,
      rgba(184, 194, 204, 0.5) 325deg,
      transparent 360deg
    );
    animation: uplink-spin 6s linear infinite;
  }

  .uplink-card.is-transmitting .uplink-ring {
    animation-duration: 2.4s;
  }

  @keyframes uplink-spin {
    to { transform: rotate(360deg); }
  }

  .uplink-mask {
    position: absolute;
    inset: 1px;
    z-index: 1;
    border-radius: 5px;
    background: var(--deep-navy);
    background-image:
      linear-gradient(to right, rgba(184, 194, 204, 0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(184, 194, 204, 0.06) 1px, transparent 1px);
    background-size: 26px 26px, 26px 26px;
  }

  /* Slow radar sweep behind the content; speeds up + brightens while transmitting. */
  .uplink-sweep {
    position: absolute;
    inset: 1px;
    z-index: 2;
    border-radius: 5px;
    overflow: hidden;
    opacity: 0.5;
    transition: opacity 0.4s ease;
  }

  .uplink-card.is-transmitting .uplink-sweep {
    opacity: 0.9;
  }

  .uplink-sweep::before {
    content: '';
    position: absolute;
    inset: -75%;
    background: conic-gradient(from 0deg at 50% 50%, rgba(237, 239, 243, 0.12), transparent 22%, transparent 100%);
    animation: uplink-spin 9s linear infinite;
  }

  .uplink-card.is-transmitting .uplink-sweep::before {
    animation-duration: 4s;
  }

  /* One-shot boot scanline on reveal. */
  .uplink-scanline {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 2px;
    z-index: 3;
    background: linear-gradient(to right, transparent, var(--star-white), transparent);
    opacity: 0;
  }

  .uplink-card.is-visible .uplink-scanline {
    animation: uplink-boot 1.1s ease-out 0.1s forwards;
  }

  @keyframes uplink-boot {
    0%   { top: 0%;   opacity: 0; }
    8%   { opacity: 1; }
    85%  { opacity: 0.7; }
    100% { top: 100%; opacity: 0; }
  }

  /* HUD targeting corners, draw in staggered on reveal. */
  .hud-corner {
    position: absolute;
    width: 16px;
    height: 16px;
    z-index: 4;
    border: 1.5px solid var(--star-white);
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .hud-corner--tl { top: 7px; left: 7px; border-right: none; border-bottom: none; }
  .hud-corner--tr { top: 7px; right: 7px; border-left: none; border-bottom: none; transition-delay: 0.08s; }
  .hud-corner--bl { bottom: 7px; left: 7px; border-right: none; border-top: none; transition-delay: 0.16s; }
  .hud-corner--br { bottom: 7px; right: 7px; border-left: none; border-top: none; transition-delay: 0.24s; }

  .uplink-card.is-visible .hud-corner {
    opacity: 0.9;
    transform: scale(1);
  }

  .uplink-content {
    position: relative;
    z-index: 5;
    padding: 1.75rem clamp(1.25rem, 4vw, 2rem);
  }

  @media (prefers-reduced-motion: reduce) {
    .uplink-card {
      transition: opacity 0.4s ease;
      transform: none;
    }
    .uplink-ring,
    .uplink-sweep::before {
      animation: none;
    }
    .uplink-scanline {
      animation: none;
      opacity: 0;
    }
    .hud-corner {
      transition: opacity 0.4s ease;
      transform: none;
      transition-delay: 0s !important;
    }
    .cursor {
      animation: none;
      opacity: 1;
    }
  }
</style>
</head>
<body>

<div class="intro">
  <span>Chatbox Redesign &middot; Comparison</span>
  <p>Same content, same waveform, same typewriter &mdash; only the outer card treatment changes. Not wired into the real site yet.</p>
</div>

<div class="compare">
  <div>
    <div class="compare-label">Current &middot; flat bordered box</div>
    <div class="chatbox-current">
      <div class="chat-header">
        <div class="waveform" aria-hidden="true" data-wf="a">
          <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
        </div>
        <span class="chat-label">TRISOLARAN_UPLINK</span>
      </div>
      <p class="chat-message"><span class="typed" data-typed="a"></span><span class="cursor">&#9608;</span></p>
      <button type="button" class="support-btn">&gt; CONFIRM_DOMICILE.exe</button>
    </div>
  </div>

  <div>
    <div class="compare-label proposed">Proposed &middot; uplink terminal (HUD)</div>
    <div class="uplink-card" data-reveal>
      <div class="uplink-ring"></div>
      <div class="uplink-mask"></div>
      <div class="uplink-sweep"></div>
      <div class="uplink-scanline"></div>
      <span class="hud-corner hud-corner--tl"></span>
      <span class="hud-corner hud-corner--tr"></span>
      <span class="hud-corner hud-corner--bl"></span>
      <span class="hud-corner hud-corner--br"></span>
      <div class="uplink-content">
        <div class="chat-header">
          <div class="waveform" aria-hidden="true" data-wf="b">
            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
          </div>
          <span class="chat-label">TRISOLARAN_UPLINK</span>
        </div>
        <p class="chat-message"><span class="typed" data-typed="b"></span><span class="cursor">&#9608;</span></p>
        <button type="button" class="support-btn">&gt; CONFIRM_DOMICILE.exe</button>
      </div>
    </div>
  </div>
</div>

<script>
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MESSAGE = "hi human... sorry to bother you. our three suns keep destroying our planet and we've been looking for a new home for a while now. earth looks nice. we don't need much — just, uh, the whole planet, if that's okay? any support helps \u{1F64F}";

  /* ---------- Waveform (same model as the real site) ---------- */

  const updateWaveform = (function waveform() {
    const waveforms = Array.from(document.querySelectorAll('.waveform'));
    if (!waveforms.length) return () => {};

    const bars = waveforms.map((wf) => Array.from(wf.querySelectorAll('.wf-bar')));
    const barCount = bars[0] ? bars[0].length : 0;
    const center = (barCount - 1) / 2;
    const barFactor = new Array(barCount).fill(0).map((_, i) => {
      const d = Math.abs(i - center) / (center || 1);
      return Math.max(0.28, Math.cos(d * Math.PI * 0.5));
    });

    const MAX_H = 30;
    const IDLE_H = 1.8;

    if (reducedMotion) {
      waveforms.forEach((wf, wi) => {
        bars[wi].forEach((bar, i) => {
          const h = IDLE_H + barFactor[i] * 3;
          bar.style.transform = `scaleY(${(h / MAX_H).toFixed(3)})`;
        });
      });
      return () => {};
    }

    let energy = 0.05, targetEnergy = 0.05, quiet = false, lastReroll = 0;
    const rerollInterval = 110;
    const current = bars.map((set) => set.map(() => IDLE_H));
    const target = bars.map((set) => set.map(() => IDLE_H));

    window.__wfTalking = () => { quiet = false; targetEnergy = 0.75 + Math.random() * 0.25; };
    window.__wfSettle = () => { targetEnergy = 0.05; };
    window.__wfPulse = (kind) => {
      if (kind === 'comma') {
        targetEnergy = 0.2;
        setTimeout(() => { if (!quiet) targetEnergy = 0.7 + Math.random() * 0.3; }, 90);
      } else if (kind === 'period') {
        targetEnergy = 0.08;
        setTimeout(() => { if (!quiet) targetEnergy = 0.65 + Math.random() * 0.3; }, 220);
      } else if (kind === 'ellipsis') {
        quiet = true;
        targetEnergy = 0.14;
        setTimeout(() => { quiet = false; }, 520);
      }
    };

    return function update(t) {
      if (t - lastReroll > rerollInterval) {
        lastReroll = t;
        const burst = 0.5 + Math.random() * 0.5;
        for (let wi = 0; wi < bars.length; wi++) {
          for (let i = 0; i < barCount; i++) {
            const amp = (IDLE_H + burst * energy * (MAX_H - IDLE_H) * barFactor[i]) * (0.55 + Math.random() * 0.45);
            target[wi][i] = Math.min(MAX_H, Math.max(IDLE_H * 0.6, amp));
          }
        }
      }
      energy += (targetEnergy - energy) * 0.06;
      for (let wi = 0; wi < bars.length; wi++) {
        for (let i = 0; i < barCount; i++) {
          current[wi][i] += (target[wi][i] - current[wi][i]) * 0.18;
          bars[wi][i].style.transform = `scaleY(${(current[wi][i] / MAX_H).toFixed(3)})`;
        }
      }
      requestAnimationFrame(update);
    };
  })();
  requestAnimationFrame(updateWaveform);

  /* ---------- Typewriter, synced to the waveform, same as the real site ---------- */

  function setTransmitting(on) {
    document.querySelectorAll('.uplink-card').forEach((el) => el.classList.toggle('is-transmitting', on));
  }

  function type(el, message) {
    if (reducedMotion) { el.textContent = message; return; }
    if (window.__wfTalking) window.__wfTalking();
    setTransmitting(true);
    let i = 0;
    const iv = setInterval(() => {
      const ch = message[i];
      el.textContent += ch;
      if (window.__wfPulse) {
        if (ch === '.' && message[i + 1] === '.') { /* mid-ellipsis */ }
        else if (ch === '.' && message[i - 1] === '.' && message[i - 2] === '.') window.__wfPulse('ellipsis');
        else if (ch === ',') window.__wfPulse('comma');
        else if (ch === '.') window.__wfPulse('period');
      }
      i++;
      if (i >= message.length) {
        clearInterval(iv);
        if (window.__wfSettle) window.__wfSettle();
        setTransmitting(false);
      }
    }, 26);
  }

  document.querySelectorAll('.typed').forEach((el) => type(el, MESSAGE));

  /* ---------- Reveal for the proposed card ---------- */

  if (reducedMotion) {
    document.querySelectorAll('[data-reveal]').forEach((el) => el.classList.add('is-visible'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    document.querySelectorAll('[data-reveal]').forEach((el) => io.observe(el));
  }
</script>

</body>
</html>
