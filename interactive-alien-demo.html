<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Alien — Isolated Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void-black: #05070D;
    --deep-navy: #0B1530;
    --star-white: #EDEFF3;
    --silver: #B8C2CC;
    --alien-green: #6FBF73;
    --font-head: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void-black);
    color: var(--star-white);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .hero {
    position: relative;
    width: 100%;
    max-width: 1200px;
    min-height: 620px;
    border: 1px solid rgba(184, 194, 204, 0.15);
    display: flex;
    align-items: center;
    overflow: hidden;
    padding: 4rem;
    gap: 2rem;
  }

  .hero-copy {
    position: relative;
    z-index: 1;
    flex: 1 1 420px;
    max-width: 480px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.45rem 1rem;
    border: 1px solid rgba(184, 194, 204, 0.3);
    border-radius: 999px;
    font-family: var(--font-body);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--silver);
    margin-bottom: 1.75rem;
  }

  .hero-copy h1 {
    font-family: var(--font-head);
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -0.01em;
    color: var(--star-white);
    margin-bottom: 1.5rem;
  }

  .hero-copy p {
    font-family: var(--font-body);
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--silver);
    max-width: 38ch;
  }

  .hero-figure {
    position: relative;
    flex: 1 1 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 480px;
  }

  .figure-glow {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(111, 191, 115, 0.16) 0%, rgba(111, 191, 115, 0) 70%);
    pointer-events: none;
  }

  .alien-big {
    position: relative;
    width: min(360px, 70vw);
    height: auto;
  }

  .alien-big .alien-pupil {
    transition: transform 130ms ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .alien-big .alien-pupil {
      transition: none;
      transform: none !important;
    }
  }

  @media (max-width: 860px) {
    .hero {
      flex-direction: column;
      text-align: center;
      padding: 3rem 2rem;
    }
    .hero-copy {
      max-width: 100%;
    }
    .hero-copy p {
      max-width: 100%;
      margin: 0 auto;
    }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-copy">
    <span class="hero-badge">First Contact &middot; Sol-3</span>
    <h1>They've Been Watching This Whole Time</h1>
    <p>Same flat, geometric alien from the chatbox &mdash; just scaled way up, with eyes that still track your cursor across the whole page.</p>
  </div>

  <div class="hero-figure">
    <div class="figure-glow" aria-hidden="true"></div>
    <svg class="alien-big" viewBox="0 0 40 40" aria-hidden="true">
      <ellipse cx="20" cy="16" rx="11" ry="13" fill="var(--alien-green)"/>
      <ellipse cx="14.5" cy="15" rx="2.6" ry="3.6" fill="var(--void-black)"/>
      <ellipse cx="25.5" cy="15" rx="2.6" ry="3.6" fill="var(--void-black)"/>
      <circle class="alien-pupil" cx="14.5" cy="15" r="1" fill="var(--star-white)"/>
      <circle class="alien-pupil" cx="25.5" cy="15" r="1" fill="var(--star-white)"/>
      <path d="M20 27 L20 36 M20 36 L14 40 M20 36 L26 40" stroke="var(--alien-green)" stroke-width="1.5" fill="none"/>
    </svg>
  </div>
</div>

<script>
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  (function alienEyes() {
    const icon = document.querySelector('.alien-big');
    if (!icon || reducedMotion) return;

    const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (!canHover) return;

    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    window.addEventListener('pointermove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    }, { passive: true });

    const maxOffset = 2.2;

    function update() {
      const rect = icon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.42; // eyes sit above center of the whole figure
      const dx = mouse.x - cx;
      const dy = mouse.y - cy;
      const dist = Math.hypot(dx, dy) || 1;
      const offX = (dx / dist) * maxOffset;
      const offY = (dy / dist) * maxOffset;
      icon.querySelectorAll('.alien-pupil').forEach((p) => {
        p.style.transform = `translate(${offX}px, ${offY}px)`;
      });
      requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  })();
</script>

</body>
</html>
